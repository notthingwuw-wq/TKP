name: Push Notification Worker

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  push:
    name: Send pending notifications
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install ALL dependencies
        run: npm ci --legacy-peer-deps

      - name: Install firebase-admin + firestore explicitly
        run: npm install firebase-admin @google-cloud/firestore --no-save

      - name: Run push worker
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
        run: node scripts/push-worker-once.js
